name: Agenda cofrade diaria

on:
  # Disparo PUNTUAL: cron-job.org llama a la API de GitHub cada día a las 6:00 (ver LEEME).
  repository_dispatch:
    types: [agenda]
  schedule:
    # Solo de RESERVA: los horarios de GitHub se retrasan a veces varias horas.
    # Se lanza varias veces y el script decide: solo publica si en Madrid ya son las 6:00,
    # aún no pasa de la hora límite y hoy no se ha publicado todavía.
    # (minutos "raros" porque a las horas en punto GitHub va más saturado)
    - cron: '17 4 * * *'
    - cron: '17 5 * * *'
    - cron: '47 6 * * *'
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha AAAA-MM-DD (vacío = hoy)'
        required: false
      ensayo:
        description: 'Ensayo: genera la imagen pero NO publica'
        type: boolean
        default: true
      forzar:
        description: 'Ignorar temporada, hora y "ya preparado"'
        type: boolean
        default: false

permissions:
  contents: write

concurrency: agenda

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fuente de emojis
        run: sudo apt-get install -y fonts-noto-color-emoji > /dev/null

      - name: Preparar imagen y textos
        id: prep
        env:
          CHROME_PATH: /usr/bin/google-chrome
          # Lanzado a mano (Run workflow) no mira la hora; los automáticos sí
          COMPROBAR_HORA: ${{ github.event_name != 'workflow_dispatch' && '1' || '' }}
          FORZAR: ${{ inputs.forzar && '1' || '' }}
        run: node preparar.js ${{ inputs.fecha }}

      - name: Subir imágenes al repositorio (para que tengan URL pública)
        if: steps.prep.outputs.hay == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publicadas
          # Si la imagen es idéntica a una anterior no hay nada que guardar (no es un error)
          if ! git diff --cached --quiet; then
            git commit -m "Agenda ${{ steps.prep.outputs.fecha }}"
            git push
            sleep 15
          fi

      - name: Publicar en redes
        env:
          URL_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
          ENSAYO: ${{ inputs.ensayo && '1' || '' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node enviar.js ${{ inputs.fecha }}

      - name: Guardar resultado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publicadas || true
          git diff --cached --quiet || (git commit -m "Resultado publicación" && git push)
